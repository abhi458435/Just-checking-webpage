<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date Invitation </title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #d6336c;
      font-size: 3em;
    }
    .flowers {
      font-size: 2em;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      margin-top: 20px;
    }
    input, select, button {
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    button {
      background-color: #ff6f91;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff3c6f;
    }
    .cute-img {
      width: 150px;
      margin: 15px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h1>🌸 Will you go on a date with me🌸</h1>
  <div class="flowers">💐 🌹 🌸 🌼 🌻 💐</div>

  <!-- Background Music -->
  <audio autoplay loop>
    <source src="https://www.jiosaavn.com/song/maan-meri-jaan/ORouSw5zUVE" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Cute Images -->
  <img src="https://cdn.pixabay.com/photo/2017/02/20/18/03/cat-2083492_1280.jpg" alt="Cute Cat" class="cute-img">
  <img src="https://cdn.pixabay.com/photo/2016/02/19/10/00/beagle-1207800_1280.jpg" alt="Cute Puppy" class="cute-img">

  <form id="dateForm">
    <label>Your Answer:</label><br>
    <select id="answer">
      <option value="yes">Yes 💖</option>
      <option value="ofcourse">Of course 😍</option>
      <option value="definitely">Definitely 🌹</option>
    </select><br>
    <label>Pick a Date:</label><br>
    <input type="date" id="date"><br>
    <button type="submit">Submit 💌</button>
  </form>

  <p id="response" style="font-size:1.5em; color:#d6336c; margin-top:20px;"></p>

  <script>
    document.getElementById("dateForm").addEventListener("submit", function(e){
      e.preventDefault();
      const answer = document.getElementById("answer").value;
      const date = document.getElementById("date").value;
      document.getElementById("response").innerText = 
        `Yay! You said "${answer}" 🎉. Thank You Rishu😍 Let's meet on ${date} 💖✨`;
    });
  </script>
</body>
</html>
